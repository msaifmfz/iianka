name: static analysis

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Larastan boots the app container
      - name: Prepare Environment
        run: cp .env.example .env && php artisan key:generate

      - name: Cache PHPStan Results
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ github.run_id }}
          restore-keys: phpstan-

      - name: PHPStan
        run: composer analyse:phpstan

      - name: Psalm
        run: composer analyse:psalm

      - name: Cache Rector Results
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/rector
          key: rector-${{ github.run_id }}
          restore-keys: rector-

      - name: Rector (dry run)
        run: composer rector:check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: cp .env.example .env && php artisan key:generate

      - name: Psalm Taint Analysis
        run: composer analyse:taint -- --report=psalm-taint.sarif

      # always() so real findings still reach the Security tab when Psalm exits non-zero.
      # hashFiles guard skips the upload when an earlier step died before writing the report.
      # Fork PRs lack security-events perms; add a repo guard if fork PRs appear.
      - name: Upload Taint SARIF
        if: always() && hashFiles('psalm-taint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psalm-taint.sarif
          category: psalm-taint

      - name: Composer Audit
        run: composer audit --locked --abandoned=report

      - name: NPM Production Audit
        run: npm audit --omit=dev --audit-level=high
