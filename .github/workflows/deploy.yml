name: ci-cd

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  release:
    types:
      - published

concurrency:
  group: ci-cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'iianka' }}
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      release_id: ${{ steps.identity.outputs.release_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Record immutable source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          [[ "$REVISION" == "$EXPECTED_SHA" ]]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "release_id=$REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Test deployment tooling
        env:
          IIANKA_TEST_SYSTEMD: '1'
        run: |
          python3 -m unittest discover -s .github/deploy/tests -v
          for script in .github/deploy/*.sh; do bash -n "$script"; done
          shellcheck .github/deploy/*.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check deploy runtime helper
        run: |
          php -l .github/deploy/runtime.php
          vendor/bin/phpstan analyse .github/deploy/runtime.php --no-progress --memory-limit=1G

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build frontend assets
        run: npm run build

      - name: Run backend tests
        run: ./vendor/bin/pest --ci

      - name: Check frontend
        run: npm run lint:check && npm run format:check && npm run types:check

      - name: Install production browser test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          npx playwright install --with-deps chromium

      - name: Test production PDF previews and CRM location selection
        run: npm run test:e2e:production -- --grep 'creates a quotation|address search'

      - name: Upload production browser test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Package production release
        env:
          REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_OUTPUT: ${{ runner.temp }}/iianka-release
        run: bash .github/deploy/package.sh "$REVISION" "$RELEASE_OUTPUT"

      - name: Smoke test unpacked production release
        env:
          REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_OUTPUT: ${{ runner.temp }}/iianka-release
        run: bash .github/deploy/smoke.sh "$RELEASE_OUTPUT/release.tar.gz" "$REVISION"

      - name: Record artifact digest for owner approval
        env:
          REVISION: ${{ steps.identity.outputs.revision }}
          RELEASE_OUTPUT: ${{ runner.temp }}/iianka-release
        run: |
          echo "Release identity: $REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          cat "$RELEASE_OUTPUT/release.tar.gz.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tested release artifact
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.identity.outputs.release_id }}
          path: ${{ runner.temp }}/iianka-release/release.tar.gz*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  validate_release:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'release' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release type and tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          [[ "$(git rev-parse --verify "$TAG^{commit}")" == "$EXPECTED_SHA" ]]

          echo "Release tag: $TAG"
          echo "Is pre-release: $IS_PRERELEASE"

          if [[ "$IS_PRERELEASE" == "true" && "$TAG" != *"-rc."* ]]; then
            echo "Error: staging pre-release tags must contain '-rc.'. Example: v0.1.0-rc.1"
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "false" && "$TAG" == *"-rc."* ]]; then
            echo "Error: production releases must not use rc tags. Tag '$TAG' looks like a release candidate."
            exit 1
          fi

      - name: Validate changelog entry
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          VERSION="${VERSION%%-rc.*}"

          echo "Changelog version: $VERSION"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "Error: CHANGELOG.md is missing at tag '$TAG'."
            exit 1
          fi

          if ! grep -qF -- "## [$VERSION]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md has no '## [$VERSION]' section at tag '$TAG'."
            echo "Run 'npm run changelog -- --tag v$VERSION' before tagging, review it, commit, then re-tag."
            exit 1
          fi

          echo "Changelog section found for $VERSION"

  archive_release:
    name: Archive approved release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - ci
      - validate_release
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
    steps:
      - name: Download this run's tested artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ needs.ci.outputs.release_id }}
          path: ${{ runner.temp }}/iianka-release

      - name: Attach immutable bundle to the existing published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REVISION: ${{ needs.ci.outputs.revision }}
          RELEASE_ID: ${{ needs.ci.outputs.release_id }}
          RELEASE_OUTPUT: ${{ runner.temp }}/iianka-release
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          cd "$RELEASE_OUTPUT"
          sha256sum --check release.tar.gz.sha256
          [[ "$RELEASE_ID" =~ ^${REVISION}-[0-9]+-[0-9]+$ ]]
          [[ "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .immutable)" == false ]] || {
            echo 'Published immutable releases require a pre-publication archive flow; no deployment was attempted.' >&2
            exit 1
          }
          BUNDLE="iianka-$RELEASE_ID.tar.gz"
          cp release.tar.gz "$BUNDLE"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          gh release upload "$RELEASE_TAG" "$BUNDLE" "$BUNDLE.sha256"

  deploy:
    name: Deploy artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - ci
      - validate_release
      - archive_release
    if: ${{ github.event_name == 'release' }}
    environment: ${{ github.event.release.prerelease && 'staging' || 'production' }}

    concurrency:
      group: deploy-iianka-shared-host
      cancel-in-progress: false

    env:
      DEPLOY_ENVIRONMENT: ${{ github.event.release.prerelease && 'staging' || 'production' }}
      DEPLOY_REVISION: ${{ needs.ci.outputs.revision }}
      DEPLOY_RELEASE_ID: ${{ needs.ci.outputs.release_id }}
      DEPLOY_ARTIFACTS_READY: ${{ vars.DEPLOY_ARTIFACTS_READY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Require owner-completed host preparation
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ARTIFACTS_READY" == true ]] || {
            echo 'Artifact deploy is disabled until the owner completes the documented host preparation.' >&2
            exit 1
          }

      - name: Download this run's tested artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ needs.ci.outputs.release_id }}
          path: ${{ runner.temp }}/iianka-release

      - name: Verify artifact and configure SSH
        id: payload
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/iianka-release
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_RELEASE_ID" =~ ^${DEPLOY_REVISION}-[0-9]+-[0-9]+$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT > 0 && DEPLOY_PORT <= 65535 ))
          cd "$RELEASE_OUTPUT"
          sha256sum --check release.tar.gz.sha256
          CHECKSUM="$(sha256sum release.tar.gz | cut -d ' ' -f1)"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Missing known hosts}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing deploy key}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/deploy_key

      - name: Prepare isolated release on host
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/iianka-release
          CHECKSUM: ${{ steps.payload.outputs.checksum }}
        run: |
          set -euo pipefail
          RELEASE_ID="$DEPLOY_RELEASE_ID"
          ssh -T -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 "iianka@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/iianka-artifact-deploy prepare '$DEPLOY_ENVIRONMENT' '$RELEASE_ID' '$DEPLOY_REVISION' '$CHECKSUM'" \
            < "$RELEASE_OUTPUT/release.tar.gz"

      - name: Activate owner-approved release
        env:
          CHECKSUM: ${{ steps.payload.outputs.checksum }}
        run: |
          set -euo pipefail
          RELEASE_ID="$DEPLOY_RELEASE_ID"
          ssh -T -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 "iianka@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/iianka-artifact-deploy activate '$DEPLOY_ENVIRONMENT' '$RELEASE_ID' '$DEPLOY_REVISION' '$CHECKSUM'"
