name: ci-cd

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  release:
    types:
      - published

concurrency:
  group: ci-cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build frontend assets
        run: npm run build:ssr

      - name: Run backend tests
        run: ./vendor/bin/pest --ci

      - name: Check frontend
        run: npm run lint:check && npm run format:check && npm run types:check

  validate_release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'release' }}

    steps:
      - name: Validate release type and tag
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          IS_PRERELEASE="${{ github.event.release.prerelease }}"

          echo "Release tag: $TAG"
          echo "Is pre-release: $IS_PRERELEASE"

          if [[ "$IS_PRERELEASE" == "true" && "$TAG" != *"-rc."* ]]; then
            echo "Error: staging pre-release tags must contain '-rc.'. Example: v0.1.0-rc.1"
            exit 1
          fi

          if [[ "$IS_PRERELEASE" == "false" && "$TAG" == *"-rc."* ]]; then
            echo "Error: production releases must not use rc tags. Tag '$TAG' looks like a release candidate."
            exit 1
          fi

  deploy_staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - ci
      - validate_release
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == true && contains(github.event.release.tag_name, '-rc.') }}
    environment: staging

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEPLOY_REF: refs/tags/${{ github.event.release.tag_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_TARGET_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Missing DEPLOY_SSH_KNOWN_HOSTS secret}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_PRIVATE_KEY secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key

      - name: Deploy over SSH
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_TARGET_PATH:?Missing target path}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "iianka@$DEPLOY_HOST" \
            "DEPLOY_ENVIRONMENT='$DEPLOY_ENVIRONMENT' DEPLOY_REF='$DEPLOY_REF' DEPLOY_RELEASE_TAG='$DEPLOY_RELEASE_TAG' DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"

          php artisan down --render="errors::503" --retry=60 || true
          trap 'php artisan up || true' EXIT

          git fetch --prune --tags origin

          RELEASE_COMMIT="$(git rev-parse --verify "$DEPLOY_REF^{commit}")"
          echo "Deploying $DEPLOY_RELEASE_TAG ($RELEASE_COMMIT) to $DEPLOY_ENVIRONMENT"

          git checkout "$DEPLOY_REF"

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan optimize
          php artisan wayfinder:generate

          npm ci
          npm run build:ssr

          php artisan queue:restart
          php artisan reload || true

          php artisan up
          trap - EXIT
          REMOTE

  deploy_production:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - ci
      - validate_release
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-rc.') }}
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      DEPLOY_ENVIRONMENT: production
      DEPLOY_RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEPLOY_REF: refs/tags/${{ github.event.release.tag_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_TARGET_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Missing DEPLOY_SSH_KNOWN_HOSTS secret}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_PRIVATE_KEY secret}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key

      - name: Deploy over SSH
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_TARGET_PATH:?Missing target path}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "iianka@$DEPLOY_HOST" \
            "DEPLOY_ENVIRONMENT='$DEPLOY_ENVIRONMENT' DEPLOY_REF='$DEPLOY_REF' DEPLOY_RELEASE_TAG='$DEPLOY_RELEASE_TAG' DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"

          php artisan down --render="errors::503" --retry=60 || true
          trap 'php artisan up || true' EXIT

          git fetch --prune --tags origin

          RELEASE_COMMIT="$(git rev-parse --verify "$DEPLOY_REF^{commit}")"
          echo "Deploying $DEPLOY_RELEASE_TAG ($RELEASE_COMMIT) to $DEPLOY_ENVIRONMENT"

          git checkout "$DEPLOY_REF"

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan optimize
          php artisan wayfinder:generate

          npm ci
          npm run build:ssr

          php artisan queue:restart
          php artisan reload || true

          php artisan up
          trap - EXIT
          REMOTE
