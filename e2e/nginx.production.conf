worker_processes 1;
pid .playwright/nginx-production.pid;
error_log stderr;

events {
    worker_connections 128;
}

http {
    # Match staging's MIME behavior: JavaScript is mapped for .js only.
    # An accidentally emitted .mjs worker must fail this regression suite.
    types {
        application/javascript js;
        text/css css;
        image/png png;
        image/svg+xml svg;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path .playwright/nginx-client;
    proxy_temp_path .playwright/nginx-proxy;

    server {
        listen 127.0.0.1:8011;
        server_name localhost;
        root public;

        location /build/ {
            try_files $uri =404;
        }

        location / {
            proxy_pass http://127.0.0.1:8010;
            # Inertia preload Link headers exceed Linux's 4k default buffer.
            # Match the capacity of staging's configured FastCGI buffers.
            proxy_buffer_size 32k;
            proxy_buffers 16 16k;
            proxy_busy_buffers_size 32k;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
